[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracereq"
version = "0.2.0"
description = "Project requirements and traceability management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-multipart>=0.0.18,<1.0",
    "Jinja2>=3.1.6,<4.0",
    "SQLAlchemy>=2.0.46,<2.1",
    "openpyxl>=3.1.5,<4.0",
    "python-docx>=1.2,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1.0"]
dev = ["ruff>=0.9,<1.0", "mypy>=1.14,<2.0", "types-openpyxl>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["tracereq"]
branch = true

[project.scripts]
tracereq = "tracereq.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tracereq.web" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Bootstrap must explain the minimum version before the package is installed.
"run_app.py" = ["UP036"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
files = ["src/tracereq"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["docx.*"]
ignore_missing_imports = true
